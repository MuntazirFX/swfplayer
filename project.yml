name: SWFPlayer
options:
  bundleIdPrefix: com.swfplayer
  deploymentTarget:
    iOS: "15.0"
targets:
  SWFPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: www
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swfplayer.app
        PRODUCT_NAME: SWFPlayer
        MARKETING_VERSION: "2.6"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SWFPlayer-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: SWF Player
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

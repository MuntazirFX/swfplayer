<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
ruffle-player{position:fixed;display:block}
#cur{position:fixed;left:0;top:0;width:26px;height:26px;display:none;pointer-events:none;z-index:99999;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='26' height='26' viewBox='0 0 26 26'><path d='M3 2 L3 20 L8 15.5 L11.5 23 L14.5 21.7 L11 14.5 L18 14.5 Z' fill='white' stroke='black' stroke-width='1.6' stroke-linejoin='round'/></svg>") no-repeat}
#fps{position:fixed;right:10px;top:8px;z-index:99998;display:none;pointer-events:none;
  font:600 13px -apple-system,Helvetica,Arial,sans-serif;color:#fff;background:rgba(0,0,0,.55);padding:3px 8px;border-radius:8px}
</style>
<script>
/* Frame-rate cap + counter: runs BEFORE Ruffle so its animation loop is wrapped. */
(function () {
  var S = window.__pf = { cap: 0, auto: true, frames: 0, lastT: -1 };
  var raf = window.requestAnimationFrame.bind(window);
  window.requestAnimationFrame = function (cb) {
    return raf(function wrap(t) {
      if (S.cap > 0 && t !== S.lastT && (t - S.lastT) < (1000 / S.cap - 1.5)) { raf(wrap); return; }
      if (t !== S.lastT) { S.lastT = t; S.frames++; }
      cb(t);
    });
  };
})();
</script>
</head><body><div id="probe"></div><div id="cur"></div><div id="fps"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const gid = q.get("game") || "game";
  const engine = q.get("engine") || "standard";   // standard | perf | cdn
  const renderer = q.get("renderer") || "auto";   // auto | webgpu | webgl | canvas
  let mode = q.get("scale") || "auto";            // auto | showAll (fit) | noBorder (fill) | exactFit (stretch)
  let sw = parseInt(q.get("w")) || 0, sh = parseInt(q.get("h")) || 0;
  const known = sw > 0 && sh > 0;
  let showCursor = q.get("cursor") === "1";
  let trackpad = q.get("trackpad") === "1";
  let gain = 1.5;
  let userPaused = false;
  const born = Date.now();

  const S = window.__pf;
  const fpsParam = parseInt(q.get("fps")) || 0;
  S.auto = fpsParam === 0;
  S.cap = fpsParam;

  function post(m) { try { window.webkit.messageHandlers.pf.postMessage(m); } catch (e) {} }

  /* ---- Render resolution (devicePixelRatio override) ----
     "auto" = just enough pixels for the game's own size (about 1.25x), never more than the screen has. */
  const realDpr = window.devicePixelRatio || 1;
  const dprMode = q.get("dpr") || "auto";         // auto | 0 (native) | number
  let curDpr = Math.min(realDpr, 2);
  if (dprMode !== "auto") {
    const v = parseFloat(dprMode);
    curDpr = v > 0 ? Math.min(v, realDpr) : realDpr;
  }
  try { Object.defineProperty(window, "devicePixelRatio", { get: () => curDpr, configurable: true }); } catch (e) {}

  /* ---- Restore backed-up save data (never overwrite what WebKit already has) ---- */
  try {
    if (window.__saves) for (const k in window.__saves) {
      if (localStorage.getItem(k) === null) localStorage.setItem(k, window.__saves[k]);
    }
  } catch (e) {}

  const probe = document.getElementById("probe");
  const curEl = document.getElementById("cur");
  const fpsEl = document.getElementById("fps");
  let player = null;
  let cx = window.innerWidth / 2, cy = window.innerHeight / 2;

  function loadScript(src, ok, fail) {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  }
  function boot() {
    if (engine === "cdn") {
      loadScript("https://unpkg.com/@ruffle-rs/ruffle", start, () => loadScript("ruffle/ruffle.js", start, () => {}));
    } else {
      loadScript("ruffle/ruffle.js", start, () => {});
    }
  }

  function insets() {
    const c = getComputedStyle(probe);
    return { t: parseFloat(c.paddingTop) || 0, r: parseFloat(c.paddingRight) || 0,
             b: parseFloat(c.paddingBottom) || 0, l: parseFloat(c.paddingLeft) || 0 };
  }
  function place(L, T, W, H) {
    const s = player.style;
    s.left = L + "px"; s.top = T + "px"; s.width = W + "px"; s.height = H + "px";
  }
  function layout() {
    if (!player) return;
    const vw = window.innerWidth, vh = window.innerHeight;
    if (!vw || !vh) return;                          // view not sized yet (e.g. mid-rotation)
    if (!known) { place(0, 0, vw, vh); return; }     // Ruffle letterboxes by itself
    const ar = sw / sh;
    const contain = (aw, ah) => { let w = aw, h = w / ar; if (h > ah) { h = ah; w = h * ar; } return [w, h]; };
    const cover   = (aw, ah) => { let w = aw, h = w / ar; if (h < ah) { h = ah; w = h * ar; } return [w, h]; };
    const near = Math.abs(ar / (vw / vh) - 1) <= 0.06;
    let L = 0, T = 0, W = vw, H = vh;
    if (mode === "exactFit" || (mode === "auto" && near)) {
    } else if (mode === "noBorder") {
      [W, H] = cover(vw, vh); L = (vw - W) / 2; T = (vh - H) / 2;
    } else {
      const i = insets();
      const aw = vw - i.l - i.r, ah = vh - i.t - i.b;
      [W, H] = contain(aw, ah);
      L = i.l + (aw - W) / 2; T = i.t + (ah - H) / 2;
    }
    if (dprMode === "auto") {
      let nd = (sw * 1.25) / Math.max(W, 1);
      nd = Math.max(1, Math.min(realDpr, nd));
      curDpr = Math.round(nd * 4) / 4;
    }
    place(L, T, W, H);
  }

  /* ---------- virtual mouse ---------- */
  let btnMask = 0;
  function drawCursor() {
    curEl.style.display = showCursor ? "block" : "none";
    curEl.style.transform = "translate(" + cx + "px," + cy + "px)";
  }
  function clampCursor() {
    cx = Math.max(0, Math.min(window.innerWidth - 1, cx));
    cy = Math.max(0, Math.min(window.innerHeight - 1, cy));
  }
  function target() {
    const sr = player && player.shadowRoot;
    return (sr && sr.querySelector("canvas")) || player;
  }
  function ptr(type, button, buttons) {
    const t = target(); if (!t) return;
    t.dispatchEvent(new PointerEvent(type, {
      bubbles: true, cancelable: true, composed: true, view: window,
      clientX: cx, clientY: cy, screenX: cx, screenY: cy,
      pointerId: 1, pointerType: "mouse", isPrimary: true, button: button, buttons: buttons
    }));
  }
  const maskOf = (b) => (b === 2 ? 2 : b === 1 ? 4 : 1);
  function moveBy(dx, dy) { cx += dx; cy += dy; clampCursor(); drawCursor(); ptr("pointermove", -1, btnMask); }
  function mdown(b) { btnMask |= maskOf(b); ptr("pointerdown", b, btnMask); }
  function mup(b)   { btnMask &= ~maskOf(b); ptr("pointerup", b, btnMask); }
  function click(b) { mdown(b); setTimeout(() => mup(b), 40); }

  /* Virtual-mouse mode: direct touches on the game screen are ignored completely.
     The pointer is moved by the on-screen stick and clicked with the on-screen mouse button. */
  const opt = { capture: true, passive: false };
  ["touchstart", "touchmove", "touchend", "touchcancel",
   "pointerdown", "pointermove", "pointerup", "pointercancel",
   "mousedown", "mousemove", "mouseup", "click", "contextmenu"]
    .forEach((n) => window.addEventListener(n, (e) => {
      if (trackpad && e.isTrusted) { e.stopImmediatePropagation(); e.preventDefault(); }
    }, opt));

  /* ---------- auto frame cap: match the game's own frame rate on a rate the display can hit ---------- */
  function applyAutoCap() {
    if (!S.auto) return;
    const fr = player && player.metadata && player.metadata.frameRate;
    S.cap = fr ? (fr <= 30.5 ? 30 : 60) : 0;
  }

  /* ---------- FPS overlay + "stuck" watchdog ---------- */
  let showFps = q.get("showfps") === "1";
  let zero = 0, stuckSent = false;
  setInterval(() => {
    if (showFps) {
      const swf = player && player.metadata && player.metadata.frameRate;
      fpsEl.style.display = "block";
      fpsEl.textContent = "FPS: " + S.frames + "/" + (S.cap || (swf ? Math.round(swf) : "-"));
    } else { fpsEl.style.display = "none"; }
    if (player && !userPaused && document.visibilityState === "visible" && Date.now() - born > 6000) {
      zero = S.frames === 0 ? zero + 1 : 0;
      if (zero >= 6 && !stuckSent) { stuckSent = true; post("stuck"); }
    }
    S.frames = 0;
  }, 1000);

  /* ---------- start Ruffle ---------- */
  function start() {
    const ruffle = window.RufflePlayer.newest();
    player = ruffle.createPlayer();
    document.body.appendChild(player);
    layout(); drawCursor();
    window.addEventListener("resize", () => { layout(); clampCursor(); drawCursor(); });
    window.addEventListener("orientationchange", () => setTimeout(() => { layout(); clampCursor(); drawCursor(); }, 60));

    let sent = false;
    const ready = () => {
      if (sent) return; sent = true;
      applyAutoCap();
      post("ready");
    };
    player.addEventListener("loadedmetadata", () => { applyAutoCap(); ready(); });
    setTimeout(ready, 4000);

    const cfg = {
      url: "g/" + encodeURIComponent(gid) + ".swf",
      scale: known ? "exactFit" : "showAll",
      forceScale: true,
      quality: engine === "perf" ? "low" : (q.get("quality") || "low"),
      autoplay: "on",
      splashScreen: false
    };
    if (renderer !== "auto") cfg.preferredRenderer = renderer;
    else if (engine === "perf") cfg.preferredRenderer = "webgl";
    player.load(cfg);
  }

  window.pf = {
    pause: () => { userPaused = true; try { player.pause(); } catch (e) {} },
    play:  () => { userPaused = false; zero = 0; try { player.play(); } catch (e) {} },
    mute:  (m) => { try { player.volume = m ? 0 : 1; } catch (e) {} },
    setMode: (m) => { mode = m; layout(); },
    setCursor: (show, tp) => { showCursor = !!show; trackpad = !!tp; drawCursor(); },
    setGain: (g) => { gain = g; },
    setFps: (n) => { S.auto = !n; S.cap = n || 0; if (S.auto) applyAutoCap(); },
    showFps: (b) => { showFps = !!b; },
    moveBy: moveBy,
    mouse: (kind, b) => { if (kind === "down") mdown(b); else mup(b); },
    click: click,
    exportSaves: () => {
      const out = {};
      try {
        const a = gid, b = encodeURIComponent(gid);
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k.indexOf(a) >= 0 || k.indexOf(b) >= 0) out[k] = localStorage.getItem(k);
        }
      } catch (e) {}
      return JSON.stringify(out);
    }
  };

  boot();
})();
</script>
</body></html>
